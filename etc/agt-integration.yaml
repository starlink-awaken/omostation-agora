# 2026-09-28: ADR-0415「拒绝 AGT 整体接入, 确立能力对齐路线」→ 本集成提案作废。
# 对应 8 条 bos://*/agt/* 登记已从 bos-services.yaml 删除 (从未有实现); 能力对齐规则保留在
# ecos L0-constraints.yaml 的 agt_constraints (OWASP ASI 对照)。本文件仅留作历史, 不再被加载。
status: rejected
rejected_by: .omo/_knowledge/decisions/0415-reject-agt-integration-adopt-capability-parity.md
title: AGT × eCOS Integration Configuration
description: >
  AGT (Agent Governance Toolkit) 与 eCOS v6 的集成配置。
  定义 AGT 各子系统的 BOS URI 端点、超时、重试和安全约束。
components:
  - id: agt-sandbox
    name: AGT Sandbox
    bos_uri: bos://capability/agt/sandbox
    timeout: 30
    retry: 3
    security_level: high
  - id: agt-sre
    name: AGT SRE
    bos_uri: bos://capability/agt/sre
    timeout: 10
    retry: 2
    security_level: internal
  - id: agt-mcp-security
    name: AGT MCP Security
    bos_uri: bos://capability/agt/mcp-security
    timeout: 15
    retry: 2
    security_level: high
  - id: agt-marketplace
    name: AGT Marketplace
    bos_uri: bos://capability/agt/marketplace
    timeout: 30
    retry: 3
    security_level: external
  - id: agt-lightning
    name: AGT Lightning
    bos_uri: bos://capability/agt/lightning
    timeout: 5
    retry: 1
    security_level: internal
  - id: agt-hypervisor
    name: AGT Hypervisor
    bos_uri: bos://governance/agt/hypervisor
    timeout: 10
    retry: 2
    security_level: high
  - id: agt-policy
    name: AGT Policy Engine
    bos_uri: bos://governance/agt/policy
    timeout: 5
    retry: 1
    security_level: high
  - id: agt-trust
    name: AGT Trust Scoring
    bos_uri: bos://capability/agt/trust
    timeout: 10
    retry: 2
    security_level: internal
